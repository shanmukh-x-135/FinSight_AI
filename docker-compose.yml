# FinSight AI — local development stack.
# One command brings up Postgres, the FastAPI backend, and the Next.js frontend:
#   docker compose up --build
#
# Values here are non-secret DEV defaults. Production secrets are supplied via
# the platform's environment (Render/Vercel), never committed. See docs/deployment.md
# (added in Phase 10).

services:
  db:
    image: postgres:16-alpine
    container_name: finsight-db
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: finsight-backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@db:5432/finsight
      JWT_SECRET: dev-only-secret-not-for-production-use
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      # Persist the FAISS index + normalizer across restarts (not ephemeral).
      - finsight_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve. Keeps the container self-sufficient in dev.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: finsight-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  finsight_pgdata:
  finsight_data:
