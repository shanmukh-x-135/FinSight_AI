# FinSight AI — local development stack.
# One command brings up Postgres, the FastAPI backend, and the Next.js frontend:
#   docker compose up --build
#
# Values here are non-secret DEV defaults. Production secrets are supplied via
# the platform's environment (Render/Vercel), never committed. The one-shot EOD
# runner is documented in docs/eod-runner.md; managed scheduling is not part of
# this local web stack.

services:
  db:
    image: postgres:16-alpine
    container_name: finsight-db
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - finsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: finsight-backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@db:5432/finsight
      JWT_SECRET: dev-only-secret-not-for-production-use
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    # PostgreSQL is authoritative; this non-root-writable cache is reconstructable.
    tmpfs:
      - /app/data:mode=0770,uid=10001,gid=10001
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve. Keeps the container self-sufficient in dev.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        FRONTEND_BUILD_ENV: development
    container_name: finsight-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  finsight_pgdata:
