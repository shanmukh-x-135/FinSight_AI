[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight AI backend — AI-powered financial intelligence platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Tests import `app.*` and `config.*` from the backend root, so run pytest with
# the backend directory on the path.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# SQLAlchemy's async engine bridges sync/async via greenlets; without this,
# coverage under-reports lines in async functions that await DB operations.
concurrency = ["thread", "greenlet"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = [
    "B008", # FastAPI dependency injection intentionally calls Depends in defaults
    "E501", # line wrapping is formatter-owned; keep lint focused on correctness
]
