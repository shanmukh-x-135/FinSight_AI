[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight AI backend — AI-powered financial intelligence platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Tests import `app.*` and `config.*` from the backend root, so run pytest with
# the backend directory on the path.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
