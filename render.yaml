# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Zero-cost production topology: Render hosts only the FastAPI web service.
# Neon owns PostgreSQL and GitHub Actions invokes the one-shot EOD runner.
services:
  - type: web
    name: finsight-api
    runtime: docker
    branch: QA
    plan: free
    region: singapore
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: ./backend
    healthCheckPath: /health/db
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - docker/Dockerfile.backend
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DB_ECHO
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /tmp/finsight-data
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
