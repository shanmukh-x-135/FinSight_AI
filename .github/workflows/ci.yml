name: CI

on:
  pull_request:
  push:
    branches: [main, QA, pre-deployment]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@127.0.0.1:5432/finsight
      TEST_POSTGRES_URL: postgresql+asyncpg://finsight:finsight@127.0.0.1:5432/finsight
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-ai.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-ai.txt
      - run: python -m ruff check .
      - name: Verify fresh PostgreSQL migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - run: docker build --file docker/Dockerfile.backend backend
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
          --file docker/Dockerfile.frontend frontend
